name: Feature request
description: Something you want Claude to be able to do in Resolve.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: Describe the task in editor terms, e.g. "add a cross dissolve between every clip on V1".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today in the Resolve UI?
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I checked COVERAGE.md. It is not listed as impossible on Resolve Free, or I explain below why a workaround might exist.
          required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else (API methods, workaround ideas, sample media)
